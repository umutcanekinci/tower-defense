groups:
  menu_chrome:
    logo:
      position: [CENTER, 60]
      size: [1085, 175]
      asset: logo

object_templates:
  btn-sm:
    size: [375, 100]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  btn-lg:
    size: [1000, 100]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  button_text:
    type: text
    font: Impact
    font_size: 48
    position: [CENTER, CENTER]
  fee_text_bg:
    size: [80, 32]
    color: [0, 0, 0, 150]
  fee_text:
    type: text
    font: ComicSansMs
    font_size: 18
    color: green
    text: "0 $"
    position: [CENTER, CENTER]
  music_toggle:
    position: [25, 25]
    size: [64, 64]
    asset: icon_music
    states:
      paused:
        asset: icon_music_disabled

panels:
  main_menu:
    extends: [menu_chrome]
    objects:
      main_menu_buttons:
        layout: { direction: vertical, start: [CENTER, 300], spacing: 120 }
        objects:
          play:    { extends: btn-lg }
          contact: { extends: btn-lg }
          exit:    { extends: btn-lg }

      play_text:
        extends: button_text
        parent: play
        text: "PLAY"
      contact_text:
        extends: button_text
        parent: contact
        text: "CONTACT US"
      exit_text:
        extends: button_text
        parent: exit
        text: "EXIT"

      music_toggle:
        extends: music_toggle

      kenney_logo:
        anchor: bottom-right
        position: [-25, -25]
        size: [144, 56]
        asset: kenney_logo

  contact:
    extends: [menu_chrome]
    objects:
      social_media:
        position: [CENTER, CENTER]
        size: [750, 750]
        asset: social_media
      back:
        extends: btn-sm
        position: [93, 840]
      back_text:
        extends: button_text
        parent: back
        text: "BACK"
      music_toggle:
        extends: music_toggle

  game:
    objects:
      level_background:
        position: [15, 15]
        size: [130, 50]
        color: [50, 50, 50, 200]
      level_text:
        parent: level_background
        position: [10, CENTER]
        type: text
        text: "Level 1"
        font: ComicSansMs
        font_size: 27
        bold: true
        color: white
      live_background:
        position: [15, 75]
        size: [100, 50]
        color: [50, 50, 50, 200]
      live_image:
        parent: live_background
        position: [10, CENTER]
        size: [32, 32]
        asset: heart
      live_text:
        parent: live_background
        position: [50, CENTER]
        type: text
        text: "13"
        font: ComicSansMs
        font_size: 27
        bold: true
        color: white
      coin_background:
        position: [15, 135]
        size: [150, 50]
        color: [50, 50, 50, 200]
      coin_image:
        parent: coin_background
        type: animated
        position: [10, CENTER]
        size: [32, 32]
        asset: coin_sheet
        frame_count: 5
        fps: 8
      coin_text:
        parent: coin_background
        position: [50, CENTER]
        type: text
        text: "0"
        font: ComicSansMs
        font_size: 27
        bold: true
        color: white

      right_panel_bg:
        position: [1780, 0]
        size: [140, 1080]
        color: [50, 50, 50]
      tower_buttons:
        parent: right_panel_bg
        layout: { direction: vertical, start: [CENTER, 30], spacing: 170 }
        objects:
          buy_tower_1: { size: [96, 96], asset: buy_tower_1 }
          buy_tower_2: { size: [96, 96], asset: buy_tower_2 }
          buy_tower_3: { size: [96, 96], asset: buy_tower_3 }
          buy_tower_4:
            size: [96, 96]
            asset: buy_tower_4
            states:
              lvl2:
                asset: buy_tower_4_lvl2
      fee_bgs:
        parent: right_panel_bg
        layout: { direction: vertical, start: [CENTER, 132], spacing: 170 }
        objects:
          fee_text_bg_1: { extends: fee_text_bg }
          fee_text_bg_2: { extends: fee_text_bg }
          fee_text_bg_3: { extends: fee_text_bg }
          fee_text_bg_4: { extends: fee_text_bg }
      fee_text_1:
        extends: fee_text
        parent: fee_text_bg_1
      fee_text_2:
        extends: fee_text
        parent: fee_text_bg_2
      fee_text_3:
        extends: fee_text
        parent: fee_text_bg_3
      fee_text_4:
        extends: fee_text
        parent: fee_text_bg_4
      start_pause_button:
        parent: right_panel_bg
        position: [CENTER, 730]
        size: [64, 64]
        asset: btn_start
        states:
          pause:
            asset: btn_pause
      x2:
        parent: right_panel_bg
        position: [CENTER, 830]
        size: [64, 64]
        asset: btn_2x
        states:
          active:
            asset: btn_2x_active
      upgrade_plane_button:
        extends: btn-sm
        parent: right_panel_bg
        position: [CENTER, 930]
        size: [60, 60]
      upgrade_plane_button_text:
        extends: button_text
        parent: upgrade_plane_button
        font_size: 21
        text: "UPG PLANES"
      menu_button:
        extends: btn-sm
        parent: right_panel_bg
        position: [CENTER, 1010]
        size: [60, 60]
      menu_button_image:
        parent: menu_button
        position: [CENTER, CENTER]
        size: [32, 32]
        asset: btn_menu