groups:
  menu_chrome:
    logo:
      position: [CENTER, 60]
      size: [1085, 175]
      asset: logo

object_templates:
  btn-sm:
    size: [375, 100]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  btn-lg:
    size: [1000, 100]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  button_text:
    type: text
    font: Impact
    font_size: 48
    position: [CENTER, CENTER]
  fee_text_bg:
    size: [133, 60]
    color: [0, 0, 0, 150]
  fee_text:
    type: text
    font: ComicSansMs
    font_size: 25
    color: green
    text: "0 $"
    position: [CENTER, CENTER]
  music_toggle:
    position: [ 25, 25 ]
    size: [ 80, 80 ]
    asset: btn_music_pause
    states:
      paused:
        asset: btn_music_resume

panels:
  main_menu:
    extends: [menu_chrome]
    objects:
      play:
        extends: btn-lg
        position: [CENTER, 300]
      contact:
        extends: btn-lg
        position: [CENTER, 420]
      exit:
        extends: btn-lg
        position: [CENTER, 540]

      play_text:
        extends: button_text
        parent: play
        text: "PLAY"
      contact_text:
        extends: button_text
        parent: contact
        text: "CONTACT US"
      exit_text:
        extends: button_text
        parent: exit
        text: "EXIT"

      music_toggle:
        extends: music_toggle

      kenney_logo:
        position: [1751, 999]
        size: [144, 56]
        asset: kenney_logo

  contact:
    extends: [menu_chrome]
    objects:
      social_media:
        position: [CENTER, CENTER]
        size: [750, 750]
        asset: social_media
      back:
        extends: btn-sm
        position: [93, 840]
      back_text:
        extends: button_text
        parent: back
        text: "BACK"
      music_toggle:
        extends: music_toggle

  game:
    objects:
      live_background:
        position: [15, 15]
        size: [100, 50]
        color: [50, 50, 50, 200]
      live_image:
        parent: live_background
        position: [10, CENTER]
        size: [32, 32]
        asset: heart
      live_text:
        parent: live_background
        position: [50, CENTER]
        type: text
        text: "13"
        font: ComicSansMs
        font_size: 27
        bold: true
        color: white
      coin_background:
        position: [15, 75]
        size: [150, 50]
        color: [50, 50, 50, 200]
      coin_image:
        parent: coin_background
        type: animated
        position: [10, CENTER]
        size: [32, 32]
        asset: coin_sheet
        frame_count: 5
        fps: 8
      coin_text:
        parent: coin_background
        position: [50, CENTER]
        type: text
        text: "0"
        font: ComicSansMs
        font_size: 27
        bold: true
        color: white
      right_panel_bg:
        position: [1500, 0]
        size: [420, 1080]
        color: [50, 50, 50]
      level_text:
        parent: right_panel_bg
        type: text
        position: [CENTER, 2]
