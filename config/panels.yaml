groups:
  menu_chrome:
    logo:
      position: [CENTER, 60]
      size: [1085, 175]
      asset: logo

object_templates:
  btn-sm:
    size: [64, 64]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  btn-lg:
    size: [1000, 100]
    asset: btn
    hover: btn_hover
    nine_slice: 10
  music_toggle_icon:
    parent: music_toggle_button
    position: [CENTER, CENTER]
    size: [32, 32]
    asset: icon_music
    states:
      paused:
        asset: icon_music_disabled
  button_text:
    type: text
    font: Impact
    font_size: 48
    position: [CENTER, CENTER]
  fee_text:
    type: text
    font: ComicSansMs
    font_size: 18
    color: green
    text: "0 $"
    background_color: [0, 0, 0, 100]
    padding: [6, 16]
  stat_text:
    type: text
    background_color: [ 50, 50, 50, 200 ]
    font: ComicSansMs
    font_size: 27
    bold: true
    color: white

panels:
  main_menu:
    extends: [menu_chrome]
    objects:
      main_menu_buttons:
        layout: { direction: vertical, start: [CENTER, 300], spacing: 120 }
        objects:
          play:     { extends: btn-lg }
          contact:  { extends: btn-lg }
          settings: { extends: btn-lg }
          exit:     { extends: btn-lg }

      play_text:
        extends: button_text
        parent: play
        text: "PLAY"
      contact_text:
        extends: button_text
        parent: contact
        text: "CONTACT US"
      settings_text:
        extends: button_text
        parent: settings
        text: "SETTINGS"
      exit_text:
        extends: button_text
        parent: exit
        text: "EXIT"

      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

      kenney_logo:
        anchor: bottom-right
        position: [-25, -25]
        size: [144, 56]
        asset: kenney_logo

  contact:
    extends: [menu_chrome]
    objects:
      social_media:
        position: [CENTER, CENTER]
        size: [750, 750]
        asset: social_media
      back:
        extends: btn-sm
        size: [375, 100]
        position: [93, 840]
      back_text:
        extends: button_text
        parent: back
        text: "BACK"
      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  settings:
    extends: [menu_chrome]
    objects:
      settings_title_text:
        type: text
        font: Impact
        font_size: 48
        color: white
        position: [CENTER, 320]
        text: "SETTINGS"

      window_size_label_text:
        type: text
        font: ComicSansMs
        font_size: 24
        color: white
        position: [CENTER, 460]
        text: "WINDOW SIZE"

      window_size_back_button:
        extends: btn-sm
        position: [710, 520]
      window_size_back_button_text:
        extends: button_text
        parent: window_size_back_button
        text: "<"
      window_size_value_text:
        type: text
        font: ComicSansMs
        font_size: 32
        color: white
        background_color: [0, 0, 0, 100]
        padding: [8, 24]
        position: [CENTER, 512]
        text: "1920x1080"
      window_size_next_button:
        extends: btn-sm
        position: [1150, 520]
      window_size_next_button_text:
        extends: button_text
        parent: window_size_next_button
        text: ">"

      window_mode_label_text:
        type: text
        font: ComicSansMs
        font_size: 24
        color: white
        position: [CENTER, 600]
        text: "WINDOW MODE"

      window_mode_back_button:
        extends: btn-sm
        position: [710, 660]
      window_mode_back_button_text:
        extends: button_text
        parent: window_mode_back_button
        text: "<"
      window_mode_value_text:
        type: text
        font: ComicSansMs
        font_size: 32
        color: white
        background_color: [0, 0, 0, 100]
        padding: [8, 24]
        position: [CENTER, 652]
        text: "FULLSCREEN"
      window_mode_next_button:
        extends: btn-sm
        position: [1150, 660]
      window_mode_next_button_text:
        extends: button_text
        parent: window_mode_next_button
        text: ">"

      sfx_volume_label_text:
        type: text
        font: ComicSansMs
        font_size: 24
        color: white
        position: [CENTER, 740]
        text: "SFX VOLUME"

      sfx_volume_back_button:
        extends: btn-sm
        position: [710, 800]
      sfx_volume_back_button_text:
        extends: button_text
        parent: sfx_volume_back_button
        text: "<"
      sfx_volume_value_text:
        type: text
        font: ComicSansMs
        font_size: 32
        color: white
        background_color: [0, 0, 0, 100]
        padding: [8, 24]
        position: [CENTER, 792]
        text: "100%"
      sfx_volume_next_button:
        extends: btn-sm
        position: [1150, 800]
      sfx_volume_next_button_text:
        extends: button_text
        parent: sfx_volume_next_button
        text: ">"

      music_volume_label_text:
        type: text
        font: ComicSansMs
        font_size: 24
        color: white
        position: [CENTER, 880]
        text: "BGM VOLUME"

      music_volume_back_button:
        extends: btn-sm
        position: [710, 940]
      music_volume_back_button_text:
        extends: button_text
        parent: music_volume_back_button
        text: "<"
      music_volume_value_text:
        type: text
        font: ComicSansMs
        font_size: 32
        color: white
        background_color: [0, 0, 0, 100]
        padding: [8, 24]
        position: [CENTER, 932]
        text: "100%"
      music_volume_next_button:
        extends: btn-sm
        position: [1150, 940]
      music_volume_next_button_text:
        extends: button_text
        parent: music_volume_next_button
        text: ">"

      back:
        extends: btn-sm
        size: [375, 100]
        position: [93, 840]
      back_text:
        extends: button_text
        parent: back
        text: "BACK"
      music_toggle_button:
        extends: btn-sm
        position: [25, 25]
      music_toggle_icon:
        extends: music_toggle_icon

  game:
    objects:
      level_text:
        extends: stat_text
        position: [15, 15]
        padding: [5, 10]
        text: "Level 1"
      live_text:
        extends: stat_text
        position: [15, 75]
        padding: [ 5, 10, 5, 50 ]
        text: "13"
      live_image:
        parent: live_text
        position: [10, CENTER]
        size: [ 32, 32 ]
        asset: heart
      coin_text:
        extends: stat_text
        position: [ 15, 135 ]
        padding: [ 5, 10, 5, 50 ]
        text: "0"
      coin_image:
        parent: coin_text
        type: animated
        position: [10, CENTER]
        size: [32, 32]
        asset: coin_sheet
        frame_count: 5
        fps: 8

      control_panel_bg:
        anchor: top-right
        position: [-15, 15]
        size: [120, 200]
      button_panel:
        parent: control_panel_bg
        layout: { direction: vertical, start: [CENTER, 0], spacing: 100 }
        objects:
          menu_button:          { extends: btn-sm, size: [60, 60] }
          start_pause_button:   { extends: btn-sm, size: [60, 60] }
          music_toggle_button:  { extends: btn-sm, size: [60, 60] }
          speed_toggle_button:
            extends: btn-sm
            size: [60, 60]
            states:
                x2_active:
                    asset: btn_active
                x4_active:
                    asset: btn_active_2
          upgrade_plane_button:
            extends: btn-sm
            size: [60, 60]
            states:
                purchased:
                    asset: btn_active

      menu_button_icon:
        parent: menu_button
        position: [CENTER, CENTER]
        size: [32, 32]
        asset: btn_menu
      start_pause_button_icon:
        parent: start_pause_button
        position: [CENTER, CENTER]
        size: [32, 32]
        asset: icon_play
        states:
          pause:
            asset: icon_pause
      music_toggle_icon:
        extends: music_toggle_icon
      speed_toggle_button_text:
        extends: button_text
        parent: speed_toggle_button
        font_size: 28
        text: "x1"
        states:
          x2_active: "x2"
          x4_active: "x4"
      upgrade_plane_button_text:
        extends: button_text
        parent: upgrade_plane_button
        font_size: 21
        text: "UPG PLANES"
        states:
          hover: "5K $"

      tower_panel_bg:
        anchor: bottom
        position: [0, -10]
        size: [650, 160]
        color: [50, 50, 50, 200]
      tower_buttons:
        parent: tower_panel_bg
        layout: { direction: horizontal, start: [30, 15], spacing: 170 }
        objects:
          buy_tower_1: { size: [96, 96], asset: buy_tower_1 }
          buy_tower_2: { size: [96, 96], asset: buy_tower_2 }
          buy_tower_3: { size: [96, 96], asset: buy_tower_3 }
          buy_tower_4:
            size: [96, 96]
            asset: buy_tower_4
            states:
              lvl2:
                asset: buy_tower_4_lvl2
      fee_texts:
        parent: tower_panel_bg
        layout: { direction: horizontal, start: [40, 120], spacing: 170 }
        objects:
          fee_text_1: { extends: fee_text }
          fee_text_2: { extends: fee_text }
          fee_text_3: { extends: fee_text }
          fee_text_4: { extends: fee_text }
