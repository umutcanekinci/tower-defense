        position: [64, 379]
      fee_text_bg_2:
        extends: fee_text_bg
        parent: right_panel_bg
        position: [255, 379]
      fee_text_bg_3:
        extends: fee_text_bg
        parent: right_panel_bg
        position: [64, 607]
      fee_text_bg_4:
        extends: fee_text_bg
        parent: right_panel_bg
        position: [255, 607]
