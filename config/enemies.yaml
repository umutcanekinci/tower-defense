# Enemy base stats — HP and kill_money scale +25% per wave level at runtime.
# damage = lives lost when the enemy reaches the exit.
#
# Per-enemy "value ratio" (kill_money / hp) is intentionally similar (~0.20)
# so the player's payout matches the work each enemy costs to kill.

enemies:
  1: {hp: 20,  speed: 1.0, kill_money: 4,  damage: 1}   # grunt
  2: {hp: 55,  speed: 1.6, kill_money: 10, damage: 1}   # fast runner
  3: {hp: 160, speed: 0.9, kill_money: 28, damage: 2}   # bruiser
  4: {hp: 420, speed: 0.7, kill_money: 75, damage: 3}   # tank
