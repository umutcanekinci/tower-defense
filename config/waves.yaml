# Wave compositions — waves beyond the last entry are generated dynamically.
#
# Each entry is either:
#   <wave>: [{type, count}, ...]                              # list form, default spawn interval
#   <wave>: {spawn_interval: <ms>, groups: [{type, count}]}   # dict form, custom interval
# Default spawn_interval is WaveManager.SPAWN_INTERVAL_MS (1000).
#
# Design: enemy HP & kill_money scale +25% per wave. Each wave's total payout
# should fund roughly one tower upgrade so the player is always one wave behind
# the curve — buying just enough to survive the next one.

waves:
  1:  [{type: 1, count: 6}]                                                       # tutorial: 1× Type-1 tower handles it
  2:  [{type: 1, count: 9}]                                                       # need 2nd tower or a Type-2
  3:  [{type: 1, count: 8},  {type: 2, count: 1}]                                 # first fast runner
  4:  [{type: 1, count: 10}, {type: 2, count: 2}]
  5:  [{type: 1, count: 8},  {type: 2, count: 3}]
  6:  {spawn_interval: 800, groups: [{type: 1, count: 12}, {type: 2, count: 2}]}  # density spike
  7:  [{type: 1, count: 7},  {type: 2, count: 3}, {type: 3, count: 1}]            # first bruiser — needs Type-3 or Type-2 L2
  8:  [{type: 1, count: 8},  {type: 2, count: 3}, {type: 3, count: 1}]
  9:  [{type: 1, count: 9},  {type: 2, count: 4}, {type: 3, count: 2}]
  10: [{type: 1, count: 6},  {type: 2, count: 4}, {type: 3, count: 2}, {type: 4, count: 1}]
  11: [{type: 1, count: 7},  {type: 2, count: 4}, {type: 3, count: 2}, {type: 4, count: 1}]
  12: [{type: 1, count: 8},  {type: 2, count: 4}, {type: 3, count: 3}, {type: 4, count: 1}]
  13: [{type: 1, count: 6},  {type: 2, count: 5}, {type: 3, count: 3}, {type: 4, count: 1}]
  14: [{type: 1, count: 7},  {type: 2, count: 5}, {type: 3, count: 3}, {type: 4, count: 2}]
  15: {spawn_interval: 750, groups: [{type: 1, count: 12}, {type: 2, count: 6}, {type: 3, count: 3}, {type: 4, count: 2}]}
  16: [{type: 1, count: 6},  {type: 2, count: 6}, {type: 3, count: 4}, {type: 4, count: 2}]
  17: [{type: 1, count: 6},  {type: 2, count: 6}, {type: 3, count: 4}, {type: 4, count: 2}]
  18: [{type: 1, count: 7},  {type: 2, count: 7}, {type: 3, count: 4}, {type: 4, count: 3}]
  19: [{type: 1, count: 8},  {type: 2, count: 7}, {type: 3, count: 5}, {type: 4, count: 3}]
  20: {spawn_interval: 700, groups: [{type: 1, count: 10}, {type: 2, count: 8}, {type: 3, count: 5}, {type: 4, count: 3}]}
  21: [{type: 1, count: 6},  {type: 2, count: 8}, {type: 3, count: 5}, {type: 4, count: 3}]
  22: [{type: 1, count: 7},  {type: 2, count: 8}, {type: 3, count: 6}, {type: 4, count: 4}]
  23: [{type: 1, count: 8},  {type: 2, count: 9}, {type: 3, count: 6}, {type: 4, count: 4}]
  24: [{type: 1, count: 6},  {type: 2, count: 9}, {type: 3, count: 7}, {type: 4, count: 4}]
  25: {spawn_interval: 650, groups: [{type: 1, count: 10}, {type: 2, count: 10}, {type: 3, count: 7}, {type: 4, count: 5}]}
