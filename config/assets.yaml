  bullet_1_lvl1:     {folder: bullets, name: 1L1}
  bullet_2_lvl1:     {folder: bullets, name: 2L1}
  bullet_2_lvl2:     {folder: bullets, name: 2L2}
  bullet_2_lvl3:     {folder: bullets, name: 2L3}
  bullet_3_lvl1:     {folder: bullets, name: 3L1}
  bullet_3_lvl2:     {folder: bullets, name: 3L2}

  # ── Enemy sprites ─────────────────────────────────────────────────────
  enemy_1:           {folder: enemy, name: E1}
  enemy_2:           {folder: enemy, name: E2}
  enemy_3:           {folder: enemy, name: E3}
  enemy_4:           {folder: enemy, name: E4}

  # ── Tile overlays (placement preview) ─────────────────────────────────
  tile_block:        {folder: others, name: block}
  tile_enable:       {folder: others, name: enable}

  btn_sell:    { folder: button, name: sell }
  btn_upgrade: { folder: button, name: upgrade }
  btn_max:     { folder: button, name: max }

  # ── Coin pickup (animated spritesheet, 4-frame horizontal strip) ──────
  coin_sheet:        {folder: coins, name: MonedaD}

sounds:
  bg_music:          {folder: "", name: bg, extension: mp3}

  # ── Tower attack SFX (referenced by config/towers.yaml shoot_sound:) ──
  tower_1_shoot:     {folder: "", name: impactGeneric_light_000}
  tower_2_shoot:     {folder: "", name: impactMining_000}
  tower_3_shoot:     {folder: "", name: impactMetal_heavy_000}