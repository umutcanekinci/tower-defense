# config/assets.yaml

images:
  # ── Backgrounds & general ─────────────────────────────────────────────
  bg_main:           {folder: others, name: bg}
  logo:              {folder: others, name: logo}
  kenney_logo:       {folder: others, name: kenney_logo}
  social_media:      {folder: others, name: social_media}
  heart:             {folder: others, name: heart}

  # ── Menu buttons (normal + hover pairs) ───────────────────────────────
  btn:               {folder: gui/Green/Default, name: button_rectangle_depth_flat}
  btn_hover:         {folder: gui/Red/Default, name: button_rectangle_depth_flat}

  # ── In-game control buttons ───────────────────────────────────────────
  btn_start:         {folder: gui/Green/Double, name: arrow_basic_e}
  btn_pause:         {folder: button, name: pause}
  btn_2x:            {folder: button, name: 2x}
  btn_2x_active:     {folder: button, name: 2x2}

  # ── Music toggle buttons ──────────────────────────────────────────────
  btn_music_pause:   {folder: button, name: pauseMusic}
  btn_music_resume:  {folder: button, name: resumeMusic}

  # ── Tower buy panel icons ─────────────────────────────────────────────
  buy_tower_1:       {folder: towers, name: buy_tower1}
  buy_tower_2:       {folder: towers, name: buy_tower2}
  buy_tower_3:       {folder: towers, name: buy_tower3}
  buy_tower_4:       {folder: towers, name: buy_tower4}
  tower_2_lvl2:      {folder: towers, name: tower2L2 }
  tower_2_lvl3:      {folder: towers, name: tower2L3 }
  tower_3_lvl2:      {folder: towers, name: tower3L2 }
  buy_tower_4_lvl2:  {folder: towers, name: tower4L2}

  # ── In-world tower sprites ────────────────────────────────────────────
  tower_1_lvl1:      {folder: towers, name: tower1L1}
  tower_2_lvl1:      {folder: towers, name: tower2L1}
  tower_3_lvl1:      {folder: towers, name: tower3L1}
  tower_4_lvl1:      {folder: towers, name: tower4L1}
  tower_4_lvl2:      {folder: towers, name: tower4L2}

  # ── Tower platforms (base under the rotating turret) ──────────────────
  tower_1_platform:  {folder: towers, name: tower1platform1}
  tower_2_platform:  {folder: towers, name: tower2platform1}
  tower_3_platform:  {folder: towers, name: tower3platform1}

  # ── Plane shadows ─────────────────────────────────────────────────────
  tower_4_shadow_lvl1: {folder: towers, name: tower4shadow1}
  tower_4_shadow_lvl2: {folder: towers, name: tower4shadow2}

