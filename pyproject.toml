[project]
name = "chokepoint"
version = "0.1.3"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "colorama",
    "pyyaml",
    "pytmx",
]

[dependency-groups]
# Tooling for producing distributable builds (see chokepoint.spec / CI).
build = [
    "pyinstaller>=6.0",
    "pillow",
]

[tool.uv.sources]
pygame-core = { path = "src/pygame_core", editable = true }
