name: CI

# Fast checks on every push/PR: the pygame_core engine's test suite, plus a
# smoke test that the app itself still boots headlessly. Deliberately
# separate from release.yml, which only builds/publishes on version tags.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: pygame_core test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygame_core submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install pygame_core (incl. dev group)
        working-directory: src/pygame_core
        run: uv sync --group dev

      - name: Run pytest
        working-directory: src/pygame_core
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run pytest

  app-smoke-test:
    name: App smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygame_core submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Boot the game headlessly on every panel
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run python scripts/smoke_test.py
